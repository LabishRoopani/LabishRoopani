<svg width="880" height="280" viewBox="0 0 880 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="880" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1117"/>
      <stop offset="0.45" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#027dfd"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="880" height="280" rx="13" fill="url(#bg)"/>

  <!-- Subtle ambient glow (no filter — circles instead) -->
  <circle cx="710" cy="140" r="130" fill="#00bcd4" fill-opacity="0.04"/>
  <circle cx="710" cy="140" r="90"  fill="#00bcd4" fill-opacity="0.04"/>
  <circle cx="710" cy="140" r="50"  fill="#00bcd4" fill-opacity="0.05"/>

  <!-- Scan lines -->
  <rect x="0" y="93"  width="880" height="0.4" fill="#00bcd4" fill-opacity="0.04"/>
  <rect x="0" y="186" width="880" height="0.4" fill="#00bcd4" fill-opacity="0.04"/>

  <!-- ============================================================ -->
  <!--                        LEFT CONTENT                          -->
  <!-- ============================================================ -->

  <!-- Label -->
  <text x="48" y="66"
    font-family="Courier New, monospace"
    font-size="10" fill="#00bcd4" letter-spacing="5" fill-opacity="0.85">
    CS STUDENT  .  AI &amp; MOBILE DEV
  </text>

  <!-- Name -->
  <text x="46" y="124"
    font-family="Arial, sans-serif"
    font-size="47" font-weight="900" fill="#f0f6fc" letter-spacing="-1">
    Labish Roopani
  </text>

  <!-- Cyan underline gradient -->
  <rect x="48" y="133" width="234" height="2.5" rx="1.5" fill="#00bcd4"/>

  <!-- Role + blinking cursor -->
  <text x="48" y="166"
    font-family="Courier New, monospace"
    font-size="16" fill="#00e5ff" font-weight="700">Flutter &amp; AI Developer</text>

  <rect x="262" y="150" width="2" height="20" rx="1" fill="#00e5ff">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Tagline -->
  <text x="48" y="197" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">
    CS student building real products - AI systems,
  </text>
  <text x="48" y="213" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">
    mobile apps &amp; automation tools. Sukkur IBA.
  </text>

  <!-- Tech pills -->
  <rect x="48"  y="234" width="62" height="22" rx="11" stroke="#3776ab" stroke-width="1.2" fill="none"/>
  <text x="79"  y="249" font-family="Courier New,monospace" font-size="10.5" fill="#6baed6" text-anchor="middle">Python</text>

  <rect x="116" y="234" width="58" height="22" rx="11" stroke="#027dfd" stroke-width="1.2" fill="none"/>
  <text x="145" y="249" font-family="Courier New,monospace" font-size="10.5" fill="#54c5f8" text-anchor="middle">Flutter</text>

  <rect x="180" y="234" width="64" height="22" rx="11" stroke="#5c3ee8" stroke-width="1.2" fill="none"/>
  <text x="212" y="249" font-family="Courier New,monospace" font-size="10.5" fill="#9985e8" text-anchor="middle">OpenCV</text>

  <rect x="250" y="234" width="68" height="22" rx="11" stroke="#f5820d" stroke-width="1.2" fill="none"/>
  <text x="284" y="249" font-family="Courier New,monospace" font-size="10.5" fill="#f5a623" text-anchor="middle">Firebase</text>

  <rect x="324" y="234" width="50" height="22" rx="11" stroke="#6e6e6e" stroke-width="1.2" fill="none"/>
  <text x="349" y="249" font-family="Courier New,monospace" font-size="10.5" fill="#aaa" text-anchor="middle">React</text>

  <!-- ============================================================ -->
  <!--               RIGHT — ORBITAL ANIMATION (no filters)         -->
  <!--                     Center = (710, 140)                      -->
  <!-- ============================================================ -->

  <!-- Orbit rings -->
  <circle cx="710" cy="140" r="100" stroke="#00bcd4" stroke-width="0.6" stroke-dasharray="5 10"  fill="none" stroke-opacity="0.22"/>
  <circle cx="710" cy="140" r="70"  stroke="#027dfd" stroke-width="0.6" stroke-dasharray="4 8"   fill="none" stroke-opacity="0.20"/>
  <circle cx="710" cy="140" r="44"  stroke="#00e5ff" stroke-width="0.6" stroke-dasharray="3 6"   fill="none" stroke-opacity="0.24"/>

  <!-- Center node -->
  <circle cx="710" cy="140" r="27" fill="#0a1628" stroke="#00bcd4" stroke-width="1.6" stroke-opacity="0.9"/>
  <circle cx="710" cy="140" r="19" fill="#00bcd4" fill-opacity="0.08"/>
  <text x="710" y="145"
    font-family="Arial, sans-serif"
    font-size="13" font-weight="900" fill="#00e5ff" text-anchor="middle" letter-spacing="1">LR</text>

  <!-- Inner orbit — cyan dot #1 (CW 4s) -->
  <circle cx="754" cy="140" r="6" fill="#00bcd4">
    <animateTransform attributeName="transform" type="rotate"
      from="0 710 140" to="360 710 140" dur="4s" repeatCount="indefinite"/>
  </circle>
  <!-- Inner orbit — cyan dot #2 (offset 180, CW 4s) -->
  <circle cx="666" cy="140" r="4" fill="#54c5f8" fill-opacity="0.7">
    <animateTransform attributeName="transform" type="rotate"
      from="0 710 140" to="360 710 140" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Middle orbit — blue dot (CCW 7s) -->
  <circle cx="710" cy="70" r="6" fill="#027dfd">
    <animateTransform attributeName="transform" type="rotate"
      from="0 710 140" to="-360 710 140" dur="7s" repeatCount="indefinite"/>
  </circle>
  <!-- Middle orbit — orange dot (offset 120, CCW 7s) -->
  <circle cx="710" cy="70" r="4" fill="#f5a623" fill-opacity="0.8">
    <animateTransform attributeName="transform" type="rotate"
      from="120 710 140" to="-240 710 140" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Outer orbit — purple dot (CW 11s) -->
  <circle cx="810" cy="140" r="6" fill="#b388ff">
    <animateTransform attributeName="transform" type="rotate"
      from="0 710 140" to="360 710 140" dur="11s" repeatCount="indefinite"/>
  </circle>
  <!-- Outer orbit — teal dot (offset 180, CW 11s) -->
  <circle cx="610" cy="140" r="4" fill="#00e5ff" fill-opacity="0.6">
    <animateTransform attributeName="transform" type="rotate"
      from="180 710 140" to="540 710 140" dur="11s" repeatCount="indefinite"/>
  </circle>
  <!-- Outer orbit — pink dot (offset 300, CW 11s) -->
  <circle cx="810" cy="140" r="3.5" fill="#f06292" fill-opacity="0.6">
    <animateTransform attributeName="transform" type="rotate"
      from="300 710 140" to="660 710 140" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating ambient particles -->
  <circle cx="510" cy="78" r="1.8" fill="#00bcd4" fill-opacity="0.5">
    <animate attributeName="cy" values="78;72;78" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="542" cy="198" r="1.4" fill="#027dfd" fill-opacity="0.6">
    <animate attributeName="cy" values="198;192;198" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="855" cy="52" r="1.6" fill="#f5a623" fill-opacity="0.4">
    <animate attributeName="cy" values="52;46;52" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="832" cy="234" r="1.4" fill="#b388ff" fill-opacity="0.45">
    <animate attributeName="cy" values="234;228;234" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.45;0.8;0.45" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="492" cy="156" r="1.2" fill="#00e5ff" fill-opacity="0.35">
    <animate attributeName="fill-opacity" values="0.35;0.7;0.35" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Domain labels -->
  <text x="618" y="64"  font-family="Courier New,monospace" font-size="8.5" fill="#8b949e" letter-spacing="1" fill-opacity="0.6">AI / ML</text>
  <text x="748" y="262" font-family="Courier New,monospace" font-size="8.5" fill="#8b949e" letter-spacing="1" fill-opacity="0.6">MOBILE</text>
  <text x="802" y="102" font-family="Courier New,monospace" font-size="8.5" fill="#8b949e" letter-spacing="1" fill-opacity="0.6">CV</text>

  <!-- Border -->
  <rect width="880" height="280" rx="13" stroke="#00bcd4" stroke-width="0.6" stroke-opacity="0.20" fill="none"/>
</svg>
